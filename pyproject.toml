[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydromend"
version = "0.1.0"
description = "Learnable lag operators for post-processing hydrodynamic model output against observations."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Thomas Monahan" }]
keywords = ["oceanography", "tide gauge", "storm surge", "GTSM", "GESLA", "post-processing", "Volterra", "regression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
]

dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "scipy>=1.8",
    "scikit-learn>=1.1",
    "pyarrow>=8",
    "xarray>=2022.3",
    "netCDF4>=1.5",
    "matplotlib>=3.5",
    "seaborn>=0.12",
]

[project.optional-dependencies]
# Additive-spline (GAM) regressor backend; everything else works without it.
gam = ["statsmodels>=0.13"]
# Extra deps to run the example notebooks (the 1-D estuary solver needs numba).
examples = ["numba>=0.57", "jupyter"]
dev = ["pytest>=7", "ruff>=0.1", "statsmodels>=0.13"]

[project.urls]
Homepage = "https://github.com/thomasmonahan/hydromend"
Documentation = "https://github.com/thomasmonahan/hydromend/tree/main/docs"
Issues = "https://github.com/thomasmonahan/hydromend/issues"

[tool.hatch.build.targets.wheel]
packages = ["hydromend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
